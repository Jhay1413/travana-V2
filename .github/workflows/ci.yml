name: CI

# Tests run on pull requests targeting dev/prod (gate the merge) and on direct pushes to them.
# Migrations are handled separately, on merge, in migrate.yml.
on:
  push:
    branches: [dev, prod]
  pull_request:
    branches: [dev, prod]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Type-check, test, build
    runs-on: ubuntu-latest

    # Disposable Postgres for the integration tests (mirrors docker-compose.test.yml).
    services:
      postgres:
        # pgvector build of postgres:16: shared/schema.ts has a vector(1536) column.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: travana_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d travana_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # The integration harness reads TEST_DATABASE_URL (falls back to the local
      # docker-compose port otherwise). Point it at the service container.
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/travana_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Use the npm version pinned in package.json#packageManager (keeps the
      # lockfile resolution identical between local and CI).
      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        # Scoped to the maintained code (client, shared, server/v2). The v1 legacy
        # flat layer under server/ is excluded per CLAUDE.md — see tsconfig.ci.json.
        run: npm run check:ci
        env:
          # Node 20's default 2 GB heap runs out on this project.
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Type-check E2E tests
        run: npx tsc -p e2e/tsconfig.json

      - name: Unit tests
        run: npm test

      - name: Integration tests (real Postgres)
        run: npm run test:integration

      - name: Build
        run: npm run build

  # Browser end-to-end tests (Playwright). Non-blocking for now: a failure here does not fail the
  # workflow. It runs the real app server against a disposable Postgres on host port 55432 (the
  # only port the suite's safety guard accepts). No credentials are set anywhere in this job, and
  # `npm run test:e2e` itself blocks every non-loopback connection from the server (e2e/helpers/block-outbound.ts,
  # preloaded by start-server.ts) and from the browser (browser-guard.ts), then fails the run if one was attempted.
  e2e:
    name: E2E (Playwright, non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 30

    services:
      postgres:
        # pgvector build of postgres:16: shared/schema.ts has a vector(1536) column.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: travana_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d travana_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        # The server env is built explicitly by e2e/helpers/env.ts (allow-list, test database only).
        run: npm run test:e2e

      - name: Fail if anything tried to reach outside the machine
        # Independent of the global teardown (which also fails the run): if either violation log has
        # a line, this step fails even when the tests themselves were retried or marked as expected failures.
        if: always()
        run: |
          fail=0
          for f in e2e-results/outbound-blocked.log e2e-results/browser-violations.log; do
            if [ -s "$f" ]; then echo "::error::$f is not empty:"; cat "$f"; fail=1; fi
          done
          exit $fail

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload test results (traces, videos, screenshots, server log)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: |
            test-results/
            e2e-results/
          if-no-files-found: ignore
          retention-days: 14
