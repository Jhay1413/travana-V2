name: CI

# Tests run only as CI on pull requests targeting dev/prod (gate the merge).
# Migrations are handled separately, on merge, in migrate.yml.
on:
  pull_request:
    branches: [dev, prod]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Type-check, test, build
    runs-on: ubuntu-latest

    # Disposable Postgres for the integration tests (mirrors docker-compose.test.yml).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: travana_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d travana_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # The integration harness reads TEST_DATABASE_URL (falls back to the local
      # docker-compose port otherwise). Point it at the service container.
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/travana_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Integration tests (real Postgres)
        run: npm run test:integration

      - name: Build
        run: npm run build
