<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Facebook Messenger Integration – UI Design</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    @keyframes pulse-dot { 0%,100%{opacity:1} 50%{opacity:.5} }
    .animate-pulse-dot { animation: pulse-dot 2s ease-in-out infinite; }
    @keyframes slide-up { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
    .animate-slide-up { animation: slide-up .3s ease-out; }
    @keyframes progress { from{width:0} to{width:100%} }
    .progress-bar { animation: progress 4s ease-in-out forwards; }
    @keyframes step-check { from{opacity:0;transform:scale(.5)} to{opacity:1;transform:scale(1)} }
    .step-done { animation: step-check .3s ease-out; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 h-screen overflow-hidden">
  <div id="app" class="flex flex-col h-screen"></div>

  <script>
    let currentView = 'connected';
    let selectedConvo = '1';
    let searchQuery = '';
    let pageFilter = 'all';

    const conversations = [
      { id:'1', name:'Sarah Thompson', avatar:'ST', lastMsg:'Hi, I wanted to ask about the Maldives package you mentioned?', time:'2m ago', unread:2, online:true, page:'Apple Travel' },
      { id:'2', name:'David & Emma Wilson', avatar:'DW', lastMsg:"That's perfect! Can you send over the full itinerary?", time:'15m ago', unread:0, online:true, page:'Apple Travel' },
      { id:'3', name:'James Patterson', avatar:'JP', lastMsg:"We're interested in the Greece cruise for August", time:'1h ago', unread:1, online:false, page:'Apple Travel' },
      { id:'4', name:'Linda McCarthy', avatar:'LM', lastMsg:"Thanks for sending the quote! We'll discuss tonight.", time:'3h ago', unread:0, online:false, page:'Apple Holidays' },
      { id:'5', name:'Robert & Sarah Chen', avatar:'RC', lastMsg:'Is the early bird discount still available?', time:'5h ago', unread:0, online:false, page:'Apple Travel' },
      { id:'6', name:'Margaret O\'Brien', avatar:'MO', lastMsg:'Can we change the departure airport to Birmingham?', time:'1d ago', unread:0, online:false, page:'Apple Holidays' },
    ];

    const messages = [
      { sender:'customer', text:'Hi there! I saw your Maldives all-inclusive package on your page. Could you tell me more about it?', time:'10:23 AM', status:'read' },
      { sender:'agent', text:'Hello Sarah! Great to hear from you 😊 The Maldives package is one of our most popular — it includes 7 nights at a 5-star water villa, all meals, return flights from Manchester, and a sunset dolphin cruise.', time:'10:25 AM', status:'read' },
      { sender:'customer', text:'That sounds amazing! What dates are available and how much is it per person?', time:'10:28 AM', status:'read' },
      { sender:'agent', text:"We have availability in June and September. The price starts from £2,450 per person based on 2 sharing. If you book before the end of this month, there's a £200 early bird discount per person!", time:'10:31 AM', status:'read' },
      { sender:'customer', text:'Oh wow, that\'s a great deal. My husband and I were looking at September. Can you check exact dates for us?', time:'10:45 AM', status:'read' },
      { sender:'agent', text:"Absolutely! I'll check the best availability for September and send over a full quote. Just to confirm — would you be flying from Manchester or another airport?", time:'10:47 AM', status:'delivered' },
      { sender:'customer', text:'Hi, I wanted to ask about the Maldives package you mentioned?', time:'11:02 AM', status:'sent' },
    ];

    const fbIcon = `<svg viewBox="0 0 24 24" class="w-5 h-5" fill="currentColor"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>`;
    const messengerIcon = `<svg viewBox="0 0 24 24" class="w-5 h-5" fill="currentColor"><path d="M12 0C5.373 0 0 4.974 0 11.111c0 3.498 1.744 6.614 4.469 8.654V24l4.088-2.242c1.092.301 2.246.464 3.443.464 6.627 0 12-4.974 12-11.111S18.627 0 12 0zm1.191 14.963l-3.055-3.26-5.963 3.26L10.732 8.2l3.131 3.259L19.752 8.2l-6.561 6.763z"/></svg>`;

    function icon(name, cls='w-4 h-4') {
      const icons = {
        search: `<svg class="${cls}" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>`,
        send: `<svg class="${cls}" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="m22 2-7 20-4-9-9-4z"/><path d="m22 2-10 10"/></svg>`,
        paperclip: `<svg class="${cls}" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>`,
        image: `<svg class="${cls}" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>`,
        smile: `<svg class="${cls}" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" x2="9.01" y1="9" y2="9"/><line x1="15" x2="15.01" y1="9" y2="9"/></svg>`,
        phone: `<svg class="${cls}" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>`,
        video: `<svg class="${cls}" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="m16 13 5.223 3.482a.5.5 0 0 0 .777-.416V7.934a.5.5 0 0 0-.777-.416L16 11"/><rect width="14" height="12" x="2" y="6" rx="2"/></svg>`,
        info: `<svg class="${cls}" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>`,
        check: `<svg class="${cls}" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>`,
        checkcheck: `<svg class="${cls}" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M18 6 7 17l-5-5"/><path d="m22 10-7.5 7.5L13 16"/></svg>`,
        settings: `<svg class="${cls}" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>`,
        refresh: `<svg class="${cls}" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>`,
        shield: `<svg class="${cls}" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/></svg>`,
        zap: `<svg class="${cls}" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z"/></svg>`,
        externalLink: `<svg class="${cls}" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg>`,
        login: `<svg class="${cls}" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" x2="3" y1="12" y2="12"/></svg>`,
        circle: `<svg class="${cls}" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/></svg>`,
      };
      return icons[name] || '';
    }

    function render() {
      const app = document.getElementById('app');
      if (currentView === 'connected') app.innerHTML = renderConnected();
      else if (currentView === 'setup') app.innerHTML = renderSetup();
      else if (currentView === 'authorizing') { app.innerHTML = renderAuthorizing(); startAuthAnimation(); }
    }

    function renderHeader() {
      const isConnected = currentView === 'connected';
      return `
        <header class="flex-none bg-white border-b border-slate-200 px-6 py-3 flex items-center justify-between z-10">
          <div class="flex items-center gap-3">
            <div class="flex items-center gap-2">
              <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-blue-500 to-blue-600 flex items-center justify-center text-white shadow-sm">${messengerIcon}</div>
              <h1 class="text-lg font-bold text-slate-900">Messenger</h1>
            </div>
            ${isConnected ? `<div class="flex items-center gap-1.5 px-2.5 py-1 bg-emerald-50 border border-emerald-200 rounded-full">
              <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse-dot"></span>
              <span class="text-[10px] text-emerald-700 font-semibold">2 Pages Connected</span>
            </div>` : ''}
          </div>
          <div class="flex items-center gap-2">
            ${isConnected ? `<button onclick="switchView('setup')" class="text-xs text-slate-500 hover:text-slate-700 px-3 py-1.5 rounded-lg hover:bg-slate-100 transition-colors">View: Setup Screen</button>` : ''}
            ${currentView === 'setup' ? `<button onclick="switchView('connected')" class="text-xs text-slate-500 hover:text-slate-700 px-3 py-1.5 rounded-lg hover:bg-slate-100 transition-colors">View: Connected</button>` : ''}
          </div>
        </header>`;
    }

    function renderConnected() {
      const convo = conversations.find(c => c.id === selectedConvo);
      const filtered = conversations.filter(c => pageFilter === 'all' || c.page === pageFilter);

      return `${renderHeader()}
      <div class="flex flex-1 min-h-0">
        <!-- LEFT: Conversations List -->
        <div class="w-[340px] flex-none bg-white border-r border-slate-200 flex flex-col">
          <div class="p-4 border-b border-slate-100 space-y-3">
            <div class="flex items-center justify-between">
              <div class="flex items-center gap-2">
                <div class="w-8 h-8 rounded-full bg-gradient-to-br from-blue-500 to-blue-600 flex items-center justify-center text-white">${messengerIcon}</div>
                <div>
                  <h2 class="text-sm font-bold text-slate-900">Messenger</h2>
                  <div class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-emerald-500"></span><span class="text-[10px] text-emerald-600 font-medium">Connected</span></div>
                </div>
              </div>
              <div class="flex items-center gap-1">
                <button class="p-1.5 text-slate-400 hover:text-slate-600 hover:bg-slate-100 rounded-lg transition-colors">${icon('refresh')}</button>
                <button class="p-1.5 text-slate-400 hover:text-slate-600 hover:bg-slate-100 rounded-lg transition-colors">${icon('settings')}</button>
              </div>
            </div>
            <div class="relative">
              ${icon('search', 'absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400')}
              <input type="text" placeholder="Search conversations..." class="w-full pl-9 pr-4 py-2 bg-slate-50 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500" />
            </div>
            <div class="flex gap-1">
              ${['all','Apple Travel','Apple Holidays'].map(p => `
                <button onclick="setPageFilter('${p}')" class="px-2.5 py-1 rounded-full text-[11px] font-medium transition-colors ${pageFilter===p ? 'bg-blue-600 text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}">${p==='all'?'All Pages':p}</button>
              `).join('')}
            </div>
          </div>
          <div class="flex-1 overflow-y-auto hide-scrollbar">
            ${filtered.map(c => `
              <div onclick="selectConvo('${c.id}')" class="flex items-start gap-3 px-4 py-3 cursor-pointer transition-colors border-b border-slate-50 ${selectedConvo===c.id ? 'bg-blue-50/70' : 'hover:bg-slate-50'}">
                <div class="relative flex-none">
                  <div class="w-10 h-10 rounded-full flex items-center justify-center text-sm font-bold ${selectedConvo===c.id ? 'bg-blue-100 text-blue-700' : 'bg-slate-100 text-slate-600'}">${c.avatar}</div>
                  ${c.online ? '<div class="absolute bottom-0 right-0 w-3 h-3 bg-emerald-500 rounded-full border-2 border-white"></div>' : ''}
                </div>
                <div class="flex-1 min-w-0">
                  <div class="flex items-center justify-between mb-0.5">
                    <span class="text-sm truncate ${c.unread>0 ? 'font-bold text-slate-900' : 'font-medium text-slate-800'}">${c.name}</span>
                    <span class="text-[10px] text-slate-400 flex-none ml-2">${c.time}</span>
                  </div>
                  <div class="flex items-center justify-between">
                    <p class="text-xs truncate ${c.unread>0 ? 'text-slate-700 font-medium' : 'text-slate-500'}">${c.lastMsg}</p>
                    ${c.unread>0 ? `<span class="flex-none ml-2 w-5 h-5 rounded-full bg-blue-600 text-white text-[10px] font-bold flex items-center justify-center">${c.unread}</span>` : ''}
                  </div>
                  <span class="text-[10px] text-slate-400 mt-0.5 block">${c.page}</span>
                </div>
              </div>
            `).join('')}
          </div>
        </div>

        <!-- CENTER: Chat -->
        <div class="flex-1 flex flex-col bg-slate-50 min-w-0">
          ${convo ? `
            <div class="flex-none bg-white border-b border-slate-200 px-5 py-3 flex items-center justify-between">
              <div class="flex items-center gap-3">
                <div class="relative">
                  <div class="w-9 h-9 rounded-full bg-blue-100 text-blue-700 flex items-center justify-center text-sm font-bold">${convo.avatar}</div>
                  ${convo.online ? '<div class="absolute bottom-0 right-0 w-2.5 h-2.5 bg-emerald-500 rounded-full border-2 border-white"></div>' : ''}
                </div>
                <div>
                  <h3 class="text-sm font-semibold text-slate-900">${convo.name}</h3>
                  <span class="text-xs ${convo.online ? 'text-emerald-600' : 'text-slate-400'} font-medium">${convo.online ? 'Active now' : 'Offline'}</span>
                </div>
              </div>
              <div class="flex items-center gap-1">
                <button class="p-2 text-slate-400 hover:text-blue-600 hover:bg-blue-50 rounded-lg transition-colors">${icon('phone')}</button>
                <button class="p-2 text-slate-400 hover:text-blue-600 hover:bg-blue-50 rounded-lg transition-colors">${icon('video')}</button>
                <button class="p-2 text-slate-400 hover:text-blue-600 hover:bg-blue-50 rounded-lg transition-colors">${icon('info')}</button>
              </div>
            </div>
            <div class="flex-1 overflow-y-auto px-5 py-4 space-y-3 hide-scrollbar">
              ${messages.map(m => `
                <div class="flex ${m.sender==='agent' ? 'justify-end' : 'justify-start'} animate-slide-up">
                  <div class="max-w-[70%]">
                    <div class="px-4 py-2.5 rounded-2xl text-sm leading-relaxed ${m.sender==='agent' ? 'bg-blue-600 text-white rounded-br-md' : 'bg-white text-slate-800 border border-slate-200 rounded-bl-md shadow-sm'}">${m.text}</div>
                    <div class="flex items-center gap-1 mt-1 ${m.sender==='agent' ? 'justify-end' : ''}">
                      <span class="text-[10px] text-slate-400">${m.time}</span>
                      ${m.sender==='agent' ? (m.status==='read' ? `<span class="text-blue-400">${icon('checkcheck','w-3 h-3')}</span>` : `<span class="text-slate-400">${m.status==='delivered' ? icon('checkcheck','w-3 h-3') : icon('check','w-3 h-3')}</span>`) : ''}
                    </div>
                  </div>
                </div>
              `).join('')}
            </div>
            <div class="flex-none bg-white border-t border-slate-200 p-3">
              <div class="flex items-end gap-2">
                <div class="flex gap-1 pb-1">
                  <button class="p-2 text-slate-400 hover:text-blue-600 rounded-lg transition-colors">${icon('paperclip')}</button>
                  <button class="p-2 text-slate-400 hover:text-blue-600 rounded-lg transition-colors">${icon('image')}</button>
                </div>
                <div class="flex-1 flex items-center bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 focus-within:ring-2 focus-within:ring-blue-500/20 focus-within:border-blue-500">
                  <input type="text" placeholder="Type a message..." class="flex-1 bg-transparent text-sm outline-none" />
                  <button class="p-1 text-slate-400 hover:text-slate-600 transition-colors ml-1">${icon('smile')}</button>
                </div>
                <button class="p-2.5 bg-blue-600 hover:bg-blue-700 text-white rounded-xl transition-colors">${icon('send')}</button>
              </div>
            </div>
          ` : `
            <div class="flex-1 flex items-center justify-center">
              <div class="text-center">
                <div class="w-12 h-12 text-slate-300 mx-auto mb-3">${messengerIcon}</div>
                <p class="text-sm text-slate-500 font-medium">Select a conversation</p>
              </div>
            </div>
          `}
        </div>

        <!-- RIGHT: Context Panel -->
        <div class="w-[260px] flex-none bg-white border-l border-slate-200 p-4 overflow-y-auto hide-scrollbar">
          ${convo ? `
            <div class="space-y-5">
              <div class="text-center">
                <div class="w-16 h-16 rounded-full bg-blue-100 text-blue-700 flex items-center justify-center text-xl font-bold mx-auto mb-2">${convo.avatar}</div>
                <h3 class="text-sm font-bold text-slate-900">${convo.name}</h3>
                <p class="text-xs text-slate-500 mt-0.5">${convo.online ? 'Active now' : 'Last seen 2h ago'}</p>
              </div>

              <div class="space-y-2">
                <h4 class="text-[10px] uppercase tracking-wider font-semibold text-slate-400">Quick Actions</h4>
                <button class="w-full flex items-center gap-2 px-3 py-2 bg-emerald-50 text-emerald-700 rounded-lg text-xs font-medium hover:bg-emerald-100 transition-colors border border-emerald-200">
                  ${icon('zap','w-3.5 h-3.5')} Create Quote from Chat
                </button>
                <button class="w-full flex items-center gap-2 px-3 py-2 bg-blue-50 text-blue-700 rounded-lg text-xs font-medium hover:bg-blue-100 transition-colors border border-blue-200">
                  ${icon('externalLink','w-3.5 h-3.5')} View Client Profile
                </button>
              </div>

              <div class="space-y-2">
                <h4 class="text-[10px] uppercase tracking-wider font-semibold text-slate-400">Linked Client</h4>
                <div class="bg-slate-50 rounded-lg p-3 border border-slate-200">
                  <div class="flex items-center gap-2 mb-2">
                    <div class="w-7 h-7 rounded-full bg-indigo-100 text-indigo-700 flex items-center justify-center text-[10px] font-bold">ST</div>
                    <div><p class="text-xs font-semibold text-slate-800">Sarah Thompson</p><p class="text-[10px] text-slate-500">Client #2847</p></div>
                  </div>
                  <div class="space-y-1 text-[10px] text-slate-500">
                    <p>sarah.thompson@email.com</p>
                    <p>07412 345 678</p>
                  </div>
                </div>
              </div>

              <div class="space-y-2">
                <h4 class="text-[10px] uppercase tracking-wider font-semibold text-slate-400">Recent Quotes</h4>
                <div class="bg-amber-50 rounded-lg p-2.5 border border-amber-200">
                  <p class="text-xs font-medium text-slate-800">Maldives All-Inclusive</p>
                  <div class="flex items-center justify-between mt-1">
                    <span class="text-[10px] text-amber-700 font-medium">£4,900 pp</span>
                    <span class="text-[10px] px-1.5 py-0.5 rounded bg-amber-100 text-amber-700 font-medium">Pending</span>
                  </div>
                </div>
              </div>

              <div class="space-y-2">
                <h4 class="text-[10px] uppercase tracking-wider font-semibold text-slate-400">Page Info</h4>
                <div class="bg-slate-50 rounded-lg p-3 border border-slate-200">
                  <div class="flex items-center gap-2">
                    <div class="w-6 h-6 rounded bg-blue-600 flex items-center justify-center text-white">${fbIcon}</div>
                    <div><p class="text-xs font-semibold text-slate-800">Apple Travel</p><p class="text-[10px] text-slate-500">Business Page</p></div>
                  </div>
                </div>
              </div>
            </div>
          ` : ''}
        </div>
      </div>`;
    }

    function renderSetup() {
      return `${renderHeader()}
      <div class="flex-1 flex items-center justify-center bg-gradient-to-br from-slate-50 to-blue-50/30 overflow-y-auto">
        <div class="max-w-lg w-full mx-4 py-8">
          <div class="text-center mb-8">
            <div class="w-20 h-20 rounded-2xl bg-gradient-to-br from-blue-500 to-blue-600 flex items-center justify-center text-white mx-auto mb-4 shadow-lg" style="box-shadow:0 10px 25px -5px rgba(59,130,246,.25)">${messengerIcon}</div>
            <h1 class="text-2xl font-bold text-slate-900 mb-2">Connect Facebook Messenger</h1>
            <p class="text-sm text-slate-500 max-w-sm mx-auto">Reply to customer messages directly from your command centre. Connect your Facebook Business Page to get started.</p>
          </div>

          <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
            <div class="p-6 space-y-5">
              <div class="flex items-start gap-4">
                <div class="w-10 h-10 rounded-lg bg-blue-50 flex items-center justify-center flex-none">${icon('shield','w-5 h-5 text-blue-600')}</div>
                <div>
                  <h3 class="text-sm font-semibold text-slate-900">Secure OAuth Authorization</h3>
                  <p class="text-xs text-slate-500 mt-0.5">Sign in with your Facebook account to authorize access. We only request messaging permissions — we never post on your behalf.</p>
                </div>
              </div>
              <div class="flex items-start gap-4">
                <div class="w-10 h-10 rounded-lg bg-emerald-50 flex items-center justify-center flex-none">${icon('refresh','w-5 h-5 text-emerald-600')}</div>
                <div>
                  <h3 class="text-sm font-semibold text-slate-900">Auto-Login & Token Refresh</h3>
                  <p class="text-xs text-slate-500 mt-0.5">Stay connected automatically. Your session refreshes in the background — no need to re-login every time.</p>
                </div>
              </div>
              <div class="flex items-start gap-4">
                <div class="w-10 h-10 rounded-lg bg-violet-50 flex items-center justify-center flex-none">${icon('zap','w-5 h-5 text-violet-600')}</div>
                <div>
                  <h3 class="text-sm font-semibold text-slate-900">Real-Time Messages</h3>
                  <p class="text-xs text-slate-500 mt-0.5">Receive and reply to Messenger conversations instantly, linked to your CRM client profiles.</p>
                </div>
              </div>
            </div>
            <div class="border-t border-slate-100 p-6 bg-slate-50/50">
              <button onclick="switchView('authorizing')" class="w-full flex items-center justify-center gap-2.5 bg-[#1877F2] hover:bg-[#166FE5] text-white px-6 py-3 rounded-xl font-semibold text-sm transition-all shadow-md hover:shadow-lg" style="box-shadow:0 4px 14px -3px rgba(24,119,242,.4)">
                ${fbIcon} Continue with Facebook
              </button>
              <p class="text-[10px] text-slate-400 text-center mt-3">By connecting, you agree to allow access to your Page's Messenger conversations.</p>
            </div>
          </div>

          <div class="flex items-center justify-center gap-4 mt-6 text-xs text-slate-400">
            <span class="flex items-center gap-1">${icon('shield','w-3 h-3')} Encrypted</span>
            <span>·</span>
            <span class="flex items-center gap-1">${icon('check','w-3 h-3')} GDPR Compliant</span>
            <span>·</span>
            <span class="flex items-center gap-1">${icon('refresh','w-3 h-3')} Auto-Refresh</span>
          </div>
        </div>
      </div>`;
    }

    function renderAuthorizing() {
      const steps = [
        'Connecting to Facebook...',
        'Authorizing Messenger access...',
        'Fetching your Pages...',
        'Syncing conversations...',
      ];
      return `${renderHeader()}
      <div class="flex-1 flex items-center justify-center bg-gradient-to-br from-slate-50 to-blue-50/30">
        <div class="max-w-md w-full mx-4 text-center">
          <div class="w-16 h-16 rounded-2xl bg-gradient-to-br from-blue-500 to-blue-600 flex items-center justify-center text-white mx-auto mb-6 shadow-lg animate-pulse" style="box-shadow:0 10px 25px -5px rgba(59,130,246,.25)">
            ${icon('login','w-7 h-7')}
          </div>
          <h2 class="text-xl font-bold text-slate-900 mb-2">Authorizing...</h2>
          <p class="text-sm text-slate-500 mb-8">Please wait while we connect your Facebook account</p>
          <div class="bg-white rounded-xl border border-slate-200 shadow-sm p-6 text-left space-y-3">
            ${steps.map((s, i) => `
              <div class="flex items-center gap-3 auth-step" data-step="${i}">
                <div class="w-6 h-6 rounded-full flex items-center justify-center flex-none bg-slate-100 text-slate-400 transition-all" id="step-icon-${i}">
                  ${icon('circle','w-3 h-3')}
                </div>
                <span class="text-sm text-slate-400 transition-all" id="step-text-${i}">${s}</span>
              </div>
            `).join('')}
          </div>
          <div class="mt-6">
            <div class="h-1.5 bg-slate-100 rounded-full overflow-hidden">
              <div class="h-full bg-gradient-to-r from-blue-500 to-blue-600 rounded-full transition-all duration-1000" id="auth-progress" style="width:0%"></div>
            </div>
          </div>
        </div>
      </div>`;
    }

    let authTimer = null;
    function startAuthAnimation() {
      let step = 0;
      const total = 4;
      function advance() {
        if (step > 0) {
          const prevIcon = document.getElementById(`step-icon-${step-1}`);
          const prevText = document.getElementById(`step-text-${step-1}`);
          if (prevIcon) { prevIcon.className = 'w-6 h-6 rounded-full flex items-center justify-center flex-none bg-emerald-100 text-emerald-600 step-done'; prevIcon.innerHTML = icon('check','w-3.5 h-3.5'); }
          if (prevText) { prevText.className = 'text-sm text-emerald-700 font-medium'; }
        }
        if (step < total) {
          const curIcon = document.getElementById(`step-icon-${step}`);
          const curText = document.getElementById(`step-text-${step}`);
          if (curIcon) { curIcon.className = 'w-6 h-6 rounded-full flex items-center justify-center flex-none bg-blue-100 text-blue-600 animate-pulse'; }
          if (curText) { curText.className = 'text-sm text-blue-700 font-medium'; }
        }
        const bar = document.getElementById('auth-progress');
        if (bar) bar.style.width = `${(step/total)*100}%`;
        step++;
        if (step <= total) {
          authTimer = setTimeout(advance, 1200);
        } else {
          setTimeout(() => switchView('connected'), 800);
        }
      }
      advance();
    }

    function switchView(v) {
      if (authTimer) { clearTimeout(authTimer); authTimer = null; }
      currentView = v;
      render();
    }
    function selectConvo(id) { selectedConvo = id; render(); }
    function setPageFilter(p) { pageFilter = p; render(); }

    render();
  </script>
</body>
</html>
